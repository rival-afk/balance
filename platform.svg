<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56">
  <!-- Корпус платформы -->
  <rect x="2" y="2" width="256" height="52" rx="10" fill="#3f464e" stroke="#20252b" stroke-width="4"/>
  <!-- Верхняя дека (закруглены только верхние углы) -->
  <path d="M2 12 a10 10 0 0 1 10 -10 h236 a10 10 0 0 1 10 10 v10 H2 Z" fill="#7d8894" stroke="#20252b" stroke-width="4" stroke-linejoin="round"/>
  <!-- Предупреждающие полосы на торцах -->
  <g stroke="#e8c33a" stroke-width="5">
    <line x1="18" y1="33" x2="28" y2="47"/>
    <line x1="242" y1="33" x2="232" y2="47"/>
  </g>
  <!-- Заклёпки -->
  <g fill="#23272d">
    <circle cx="46" cy="42" r="3.5"/>
    <circle cx="98" cy="42" r="3.5"/>
    <circle cx="162" cy="42" r="3.5"/>
    <circle cx="214" cy="42" r="3.5"/>
  </g>
  <!-- Центральная метка-«ось баланса» -->
  <circle cx="130" cy="42" r="4.5" fill="#e8c33a" stroke="#20252b" stroke-width="2"/>
</svg>
